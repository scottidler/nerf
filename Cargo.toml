[package]
name = "nerf"
version = "0.1.5"
description = "Tone down volatile comments and messages with help from GPT"
edition = "2021"
build = "build.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
eyre = "0.6.14"
lazy_static = "1.5.0"
log = "0.4.34"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde_json = "1.0.151"
shellexpand = "3.1.2"

[build-dependencies]
build-version = { git = "https://github.com/tatari-tv/build-version-rs", tag = "v0.1.0", version = "0.1.0" }
